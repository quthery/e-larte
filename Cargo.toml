[package]
name = "super-puper-image-scaler"
version = "0.1.0"
edition = "2024"

[features]
upscale-tests = []
linux-cuda = ["ort/cuda"]
linux-migraphx = ["ort/migraphx", "ort/lax-feature-matching"]

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
directories = "6"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
ureq = "3.4"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "copy-dylibs", "tls-native", "api-27"] }
image = "0.25.10"
ndarray = "0.17.2"
anyhow = "1.0.104"
async-channel = "2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "copy-dylibs", "tls-native", "api-27", "coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "copy-dylibs", "tls-native", "api-27", "directml"] }
